# Include inside the existing Nginx http block. Cloudflare Tunnel is on this host.
map $http_upgrade $sidey_connection_upgrade {
    default upgrade;
    '' close;
}
log_format sidey escape=json '{"time":"$time_iso8601","service":"sidey-proxy",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"duration":$request_time,"upstream_duration":"$upstream_response_time"}';
upstream sidey_active {
    include /etc/nginx/sidey-active-upstream.conf;
    keepalive 32;
}
server {
    listen 127.0.0.1:8088;
    server_name api.sidey.app;
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    access_log /var/log/nginx/sidey-access.log sidey;
    error_log /var/log/nginx/sidey-error.log warn;
    location /api/ {
        proxy_pass http://sidey_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sidey_connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        # Replaying a non-idempotent request onto another instance is forbidden.
        proxy_next_upstream off;
    }
    location / { return 404; }
}
