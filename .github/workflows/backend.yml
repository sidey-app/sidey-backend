name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Verifier, catalog and metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/app-store-verifier/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.7'
      - name: Test checkout routing without credentials or network permissions
        run: deno test supabase/functions/_shared/commerce.test.ts
      - name: Check commerce entrypoints
        run: deno check supabase/functions/commerce-order/index.ts supabase/functions/commerce-checkout/index.ts supabase/functions/commerce-complete/index.ts
      - name: Verify pinned backend catalog mirrors
        run: python3 scripts/commerce_catalog.py --target shared --check
      - name: Test standalone catalog generation
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Test public release metrics collection
        run: node --test scripts/download-metrics/*.test.mjs
      - name: Install verifier dependencies
        working-directory: services/app-store-verifier
        run: npm ci
      - name: Build verifier and test monetary, entitlement and RPC contracts
        working-directory: services/app-store-verifier
        run: npm test
